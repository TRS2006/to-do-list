<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List | Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>To-do List</h2>
        <div class="input-group">
            <!-- Campo para digitar a tarefa -->

            <input type="text" id="taskInput" placeholder="Digite Aqui">
            
            <!-- Botão para adicionar a tarefa -->
            <button id="addTaskBtn">Adicionar</button>
        </div>

        <!-- Lista de tarefas que o JS vai preencher -->
        <ul id="taskList">
            <!-- As tarefas serão criadas dinamicamente -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
